apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Althaf05/foodhub.git
    targetRevision: main
    path: helm/mongodb
  destination:
    server: https://kubernetes.default.svc
    namespace: foodhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Althaf05/foodhub.git
    targetRevision: main
    path: helm/springboot-service
    helm:
      valueFiles:
        - ../user-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: foodhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
