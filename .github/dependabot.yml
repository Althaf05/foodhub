version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: "/services/user-service"
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: "/services/menu-service"
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: "/services/order-service"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/services/user-service"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/dev"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: "/infra/terraform/bootstrap"
    schedule:
      interval: weekly
