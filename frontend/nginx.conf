server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://user-service:8081;
    }

    location /api/menu {
        proxy_pass http://menu-service:8082;
    }

    location /api/orders {
        proxy_pass http://order-service:8083;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.html;
    }
}
