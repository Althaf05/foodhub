services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: foodhub/user-service:local
    environment:
      MONGODB_URI: mongodb://mongo:27017/foodhub
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  menu-service:
    image: foodhub/menu-service:local
    environment:
      MONGODB_URI: mongodb://mongo:27017/foodhub
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    image: foodhub/order-service:local
    environment:
      MONGODB_URI: mongodb://mongo:27017/foodhub
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: foodhub/frontend:local
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - menu-service
      - order-service

volumes:
  mongo-data:
