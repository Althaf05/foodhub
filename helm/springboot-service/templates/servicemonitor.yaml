{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.nameOverride }}
  labels:
    app: {{ .Values.nameOverride }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.nameOverride }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
