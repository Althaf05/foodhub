nameOverride: ""

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

port: 8080

replicaCount: 2

env: []

envFromSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 100Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 500Mi

probes:
  path: /health
  initialDelaySeconds: 30

rollout:
  enabled: true
  pauseSeconds: 30
